<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" style="background:#070b14;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Background Tech Grid / Circuit Elements -->
  <g opacity="0.15">
    <circle cx="250" cy="250" r="220" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="250" cy="250" r="180" fill="none" stroke="#6366f1" stroke-width="1" />
    <circle cx="250" cy="250" r="140" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <!-- Diagonal circuit lines -->
    <path d="M 50 100 L 120 100 L 160 140" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="160" cy="140" r="3" fill="#06b6d4" />
    <path d="M 450 100 L 380 100 L 340 140" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="340" cy="140" r="3" fill="#a855f7" />
    <path d="M 60 400 L 130 400 L 170 360" fill="none" stroke="#10b981" stroke-width="1.5" />
    <circle cx="170" cy="360" r="3" fill="#10b981" />
  </g>

  <!-- Holographic Ambient Ring behind Portrait -->
  <circle cx="250" cy="230" r="130" fill="url(#neonGlow)" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="250" cy="230" r="125" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.7" />

  <!-- Portrait Illustration -->
  <g transform="translate(0, 10)">
    <!-- Shoulders & Blazer -->
    <path d="M 120 480 C 130 380 170 340 250 340 C 330 340 370 380 380 480 Z" fill="url(#suitGrad)" />
    
    <!-- Formal Shirt Collar & Inner Lapel -->
    <path d="M 210 340 L 250 410 L 290 340 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 240 360 L 250 420 L 260 360 Z" fill="#0284c7" />
    <!-- Blazer Lapels -->
    <path d="M 180 345 L 235 440 L 250 440 L 220 340 Z" fill="#0f172a" />
    <path d="M 320 345 L 265 440 L 250 440 L 280 340 Z" fill="#0f172a" />

    <!-- Neck -->
    <path d="M 225 280 L 275 280 L 275 350 L 225 350 Z" fill="#b45309" />
    <path d="M 225 310 Q 250 330 275 310 L 275 345 L 225 345 Z" fill="#92400e" opacity="0.4" />

    <!-- Head / Face Structure -->
    <ellipse cx="250" cy="225" rx="65" ry="80" fill="#c27829" />
    <path d="M 185 220 C 185 280 205 305 250 305 C 295 305 315 280 315 220 C 315 170 295 150 250 150 C 205 150 185 170 185 220 Z" fill="#b86d22" />

    <!-- Ears -->
    <ellipse cx="183" cy="225" rx="8" ry="16" fill="#a15814" />
    <ellipse cx="317" cy="225" rx="8" ry="16" fill="#a15814" />

    <!-- Hair (Modern Stylish Cut) -->
    <path d="M 182 205 C 180 155 200 125 250 125 C 300 125 320 155 318 205 C 305 160 280 145 250 145 C 215 145 195 165 182 205 Z" fill="#090d16" />
    <path d="M 182 200 C 190 140 230 120 275 125 C 310 128 322 155 318 190 C 310 170 290 155 260 152 C 220 150 195 170 182 200 Z" fill="#0f172a" />
    <path d="M 185 200 L 192 230 L 198 215 Z" fill="#090d16" />
    <path d="M 315 200 L 308 230 L 302 215 Z" fill="#090d16" />

    <!-- Eyes & Eyebrows -->
    <!-- Left Eyebrow -->
    <path d="M 205 200 Q 220 194 235 200" fill="none" stroke="#090d16" stroke-width="3.5" stroke-linecap="round" />
    <!-- Right Eyebrow -->
    <path d="M 265 200 Q 280 194 295 200" fill="none" stroke="#090d16" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Eyes -->
    <ellipse cx="220" cy="215" rx="9" ry="6" fill="#ffffff" />
    <circle cx="221" cy="215" r="4.5" fill="#1e293b" />
    <circle cx="223" cy="213" r="1.5" fill="#ffffff" />

    <ellipse cx="280" cy="215" rx="9" ry="6" fill="#ffffff" />
    <circle cx="279" cy="215" r="4.5" fill="#1e293b" />
    <circle cx="281" cy="213" r="1.5" fill="#ffffff" />

    <!-- Smart Glasses (Modern Tech Frames) -->
    <rect x="202" y="204" width="38" height="24" rx="6" fill="none" stroke="#06b6d4" stroke-width="2.5" />
    <rect x="260" y="204" width="38" height="24" rx="6" fill="none" stroke="#06b6d4" stroke-width="2.5" />
    <line x1="240" y1="214" x2="260" y2="214" stroke="#06b6d4" stroke-width="2.5" />
    <line x1="184" y1="212" x2="202" y2="212" stroke="#06b6d4" stroke-width="2" />
    <line x1="298" y1="212" x2="316" y2="212" stroke="#06b6d4" stroke-width="2" />
    <!-- Glass sheen -->
    <line x1="208" y1="222" x2="225" y2="208" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <line x1="266" y1="222" x2="283" y2="208" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 250 215 L 246 242 Q 250 246 254 242 Z" fill="#92400e" opacity="0.6" />

    <!-- Confident Smile -->
    <path d="M 232 262 Q 250 275 268 262" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
    <path d="M 236 263 Q 250 272 264 263" fill="#ffffff" opacity="0.8" />
    <path d="M 235 278 Q 250 284 265 278" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Futuristic Corner HUD Markers -->
  <path d="M 40 40 L 40 70 M 40 40 L 70 40" fill="none" stroke="#06b6d4" stroke-width="2" />
  <path d="M 460 40 L 460 70 M 460 40 L 430 40" fill="none" stroke="#06b6d4" stroke-width="2" />
  <path d="M 40 460 L 40 430 M 40 460 L 70 460" fill="none" stroke="#06b6d4" stroke-width="2" />
  <path d="M 460 460 L 460 430 M 460 460 L 430 460" fill="none" stroke="#06b6d4" stroke-width="2" />

  <!-- Digital Watermark Tag -->
  <rect x="150" y="445" width="200" height="28" rx="8" fill="#0b1329" stroke="#0284c7" stroke-width="1" />
  <text x="250" y="463" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    ARUN PANDI A • B.E. ECE
  </text>
</svg>
